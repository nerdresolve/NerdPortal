services:
  migrate:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: nerdportal_migrate
    environment:
      SQLITE_DB_PATH: /data/nerdportal.db
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-}
    volumes:
      - dbdata:/data
    entrypoint: ["./docker-entrypoint.sh", "sh", "-c"]
    command:
      - |
        node database/migrate.js &&
        node /repo/database/seeds/001_admin_user.js
    networks:
      - nerdportal_net

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: nerdportal_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 4000
      SQLITE_DB_PATH: /data/nerdportal.db
      UPLOADS_DIR: /repo/apps/backend/uploads
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-15}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NerdPortal}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-LOGIN}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
    volumes:
      - dbdata:/data
      - uploads:/repo/apps/backend/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nerdportal_net

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: nerdportal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      INTERNAL_API_URL: http://backend:4000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerdportal_net

volumes:
  dbdata:
    driver: local
  uploads:
    driver: local

networks:
  nerdportal_net:
    driver: bridge
