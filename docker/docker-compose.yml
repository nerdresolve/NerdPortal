version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: itportal_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itportal}
      POSTGRES_USER: ${POSTGRES_USER:-itportal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itportal_user} -d ${POSTGRES_DB:-itportal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - itportal_net

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: itportal_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-itportal}
      POSTGRES_USER: ${POSTGRES_USER:-itportal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    volumes:
      - ../apps/backend:/app
      - /app/node_modules
      - ../uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itportal_net

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: itportal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      INTERNAL_API_URL: http://backend:4000/api/v1
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - itportal_net

volumes:
  pgdata:
    driver: local

networks:
  itportal_net:
    driver: bridge
